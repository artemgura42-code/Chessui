

name: Unpack Chess Vision

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ChessVision_GitHub_Build.zip -d extracted
          cp -a extracted/cloudChessVision-Android/ChessVision/. .
          git checkout -- .github/workflows/android.yml
          rm -rf extracted ChessVision_GitHub_Build.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Chess Vision project"
          git push
