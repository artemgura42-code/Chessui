
name: Unpack Chess Vision

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*Stockfish*Diagnost*Fixed*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Archive not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          cp -a extracted/ChessVision/. .

          # Не разрешаем распаковщику перезаписывать собственные workflow
          git checkout -- .github/workflows/android.yml
          git checkout -- .github/workflows/unpack.yml

          rm -rf extracted "$ZIP_FILE"

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Chess Vision with Stockfish diagnostics"
          git push
